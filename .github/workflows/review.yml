name: review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review again
        required: true
        type: string

permissions: {}

jobs:
  review:
    name: Jev review
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: luna-review-publish
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: marzy-agent
          workload_identity_provider: projects/715996976929/locations/global/workloadIdentityPools/luna-review/providers/repos
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private-key:marzy-agent/GITHUB_APP_PRIVATE_KEY/latest
            typesafe:marzy-agent/TYPESAFE_API_KEY/latest
          export_to_environment: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li7MnowhEXjkSkYu # marzy-agent (app 4032475), owned by Mulholland-Inc
          private-key: ${{ steps.secrets.outputs.private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TYPESAFE_API_KEY: ${{ steps.secrets.outputs.typesafe }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { review } = require('./.github/review/review.cjs');
            await review({ github, context, core }, { number: Number(process.env.PR_NUMBER), key: process.env.TYPESAFE_API_KEY, bot: process.env.REVIEW_BOT });
