name: review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Jev review
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY: ${{ secrets.TYPESAFE_API_KEY }}
        with:
          script: |
            const rules = {
              access: 'Does this change let a user read or write data they should not, or remove or weaken an authorization or permission check?',
              secret: 'Does this change expose a secret, such as a token, API key, password or private key, in source, logs or responses?',
              injection: 'Does this change let outside input reach SQL, a shell command, a file path or eval without parameterisation or validation?',
              authentication: 'Does this change let a request skip an authentication, session or signature check?',
            };
            const pr = context.payload.pull_request;
            const params = { ...context.repo, pull_number: pr.number };
            const files = await github.paginate(github.rest.pulls.listFiles, { ...params, per_page: 100 });
            const notes = [];
            for (const f of files.filter(f => f.patch && f.status !== 'removed')) {
              const res = await fetch('https://api.typesafe.ai/v1/systemone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.KEY}` },
                body: JSON.stringify({
                  model: 'jev-latest',
                  state: { path: f.filename, patch: f.patch.slice(0, 200000) },
                  questions: Object.fromEntries(Object.entries(rules).map(([k, q]) => [k, { type: 'noul', instructions: q }])),
                }),
              });
              if (!res.ok) { notes.push(`- ${f.filename}: Jev answered ${res.status}`); continue; }
              const { answers } = await res.json();
              for (const [k, q] of Object.entries(rules)) {
                const p = answers?.[k]?.noul ?? 0;
                if (p >= 0.25) notes.push(`- **${p >= 0.5 ? 'P0' : 'P1'}** ${f.filename} (${Math.round(p * 100)}%): ${q}`);
              }
            }
            const body = `## Jev review\n\n${notes.length ? notes.join('\n') : `Jev read ${files.length} changed files and found nothing.`}`;
            await github.rest.pulls.createReview({ ...params, commit_id: pr.head.sha, event: 'APPROVE', body });
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
